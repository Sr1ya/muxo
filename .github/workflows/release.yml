# Builds the Windows, macOS and Linux installers and the Chrome/Firefox extensions, and attaches
# them to a draft GitHub release.
# Runs when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0), or by hand from
# the Actions tab. Review the draft release, then publish it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev build-essential libssl-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac architectures, so the Intel build can cross-compile on an Apple Silicon runner.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing, once you have the certificates — add these as repository secrets:
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          tagName: v__VERSION__
          releaseName: Muxo v__VERSION__
          releaseBody: 'Download the installer for your system below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The browser extensions, zipped for the Chrome Web Store and Firefox Add-ons, added to the same
  # draft release once the installers have created it.
  extension:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:extension

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          (cd extension/dist/chrome && zip -qr "../muxo-chrome-$version.zip" .)
          (cd extension/dist/firefox && zip -qr "../muxo-firefox-$version.zip" .)
          gh release upload "v$version" extension/dist/*.zip --clobber
